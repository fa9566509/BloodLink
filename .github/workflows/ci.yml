name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests (real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AF.Blood.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/AF.Blood.UnitTests -c Release --no-build --logger "console;verbosity=normal"

      # Testcontainers starts PostgreSQL 17 + PostGIS inside the runner's Docker.
      - name: Integration tests
        run: dotnet test tests/AF.Blood.IntegrationTests -c Release --no-build --logger "console;verbosity=normal"

  flyway:
    name: Flyway migrations against a clean database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: aff
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: aff_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aff -d aff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Flyway migrate
        run: |
          docker run --rm --network host \
            -v "$PWD/database/sql:/flyway/sql:ro" \
            -e FLYWAY_URL="jdbc:postgresql://127.0.0.1:5433/aff_ci" \
            -e FLYWAY_USER=aff -e FLYWAY_PASSWORD=ci_password \
            -e FLYWAY_LOCATIONS="filesystem:/flyway/sql" \
            flyway/flyway:13 migrate

      - name: Flyway validate (idempotent re-run)
        run: |
          docker run --rm --network host \
            -v "$PWD/database/sql:/flyway/sql:ro" \
            -e FLYWAY_URL="jdbc:postgresql://127.0.0.1:5433/aff_ci" \
            -e FLYWAY_USER=aff -e FLYWAY_PASSWORD=ci_password \
            -e FLYWAY_LOCATIONS="filesystem:/flyway/sql" \
            flyway/flyway:13 validate

  website:
    name: Landing website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/af-foundation-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/af-foundation-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/af_blood_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
