name: af-foundation

# Local development stack. Production deployment (Coolify) is described in docs/coolify-deployment.md
# and configured via deploy/coolify/. Never commit a real .env — copy .env.example to .env first.

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: aff-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aff_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aff_blood}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aff} -d ${POSTGRES_DB:-aff_blood}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot schema migration job. Runs every time the stack is brought up;
  # Flyway applies only migrations that have not been applied yet.
  flyway:
    image: flyway/flyway:13
    container_name: aff-flyway
    command: -connectRetries=20 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aff_blood}
      FLYWAY_USER: ${POSTGRES_USER:-aff}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-aff_dev_password}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_DEFAULT_SCHEMA: public
    volumes:
      - ./database/sql:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: aff-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aff_blood};Username=${POSTGRES_USER:-aff};Password=${POSTGRES_PASSWORD:-aff_dev_password}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:5173}
      Jwt__Issuer: ${JWT_ISSUER:-af-foundation}
      Jwt__Audience: ${JWT_AUDIENCE:-af-foundation-clients}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (>= 32 random chars) or override this entry}
      Admin__BootstrapKey: ${ADMIN_BOOTSTRAP_KEY:-}
      OneSignal__AppId: ${ONESIGNAL_APP_ID:-}
      OneSignal__ApiKey: ${ONESIGNAL_API_KEY:-}
      Matching__RadiiKm: ${MATCHING_RADII_KM:-25,50,100}
      Worker__PollSeconds: 10
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: aff-worker
    entrypoint: ["dotnet", "worker/AF.Blood.Worker.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aff_blood};Username=${POSTGRES_USER:-aff};Password=${POSTGRES_PASSWORD:-aff_dev_password}
      Jwt__Issuer: ${JWT_ISSUER:-af-foundation}
      Jwt__Audience: ${JWT_AUDIENCE:-af-foundation-clients}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (>= 32 random chars) or override this entry}
      OneSignal__AppId: ${ONESIGNAL_APP_ID:-}
      OneSignal__ApiKey: ${ONESIGNAL_API_KEY:-}
      Matching__RadiiKm: ${MATCHING_RADII_KM:-25,50,100}
      Worker__PollSeconds: 10
      Worker__InstanceName: docker-worker-1
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  web:
    build:
      context: ./web/af-foundation-site
      dockerfile: Dockerfile
    container_name: aff-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_HOST_PORT:-4173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
