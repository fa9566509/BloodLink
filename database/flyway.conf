# Flyway configuration for the AF Foundation platform.
# In Docker Compose these values are supplied via FLYWAY_* environment variables
# (see docker-compose.yml). This file documents the standalone invocation:
#
#   flyway -url=jdbc:postgresql://localhost:5433/aff_blood \
#          -user=aff -password=aff_dev_password \
#          -locations=filesystem:database/sql migrate

flyway.url=jdbc:postgresql://localhost:5433/aff_blood
flyway.user=aff
flyway.password=aff_dev_password
flyway.locations=filesystem:sql
flyway.defaultSchema=public
flyway.schemas=public
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.table=flyway_schema_history
