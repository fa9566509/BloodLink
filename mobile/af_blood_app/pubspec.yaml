name: af_blood_app
description: AF Foundation blood donation coordination app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Secure storage for auth tokens
  flutter_secure_storage: ^9.2.2

  # Location (requested only when enabling discovery)
  geolocator: ^13.0.1

  # Push notifications
  onesignal_flutter: ^5.2.5

  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
