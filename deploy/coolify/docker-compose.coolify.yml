name: af-foundation-production

# Coolify-compatible stack. In Coolify, import this compose file as a
# "Docker Compose" resource and set the environment variables listed in
# docs/environment-variables.md. Postgres data lives in a persistent volume
# (`postgres_data`) — configure off-host backups per docs/backup-and-restore.md.

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot migration job executed on every deployment.
  flyway:
    image: flyway/flyway:13
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./database/sql:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Jwt__BootstrapKey: ${ADMIN_BOOTSTRAP_KEY:-}
      OneSignal__AppId: ${ONESIGNAL_APP_ID:-}
      OneSignal__ApiKey: ${ONESIGNAL_API_KEY:-}
      Matching__RadiiKm: ${MATCHING_RADII_KM:-25,50,100}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    command: ["dotnet", "worker/AF.Blood.Worker.dll"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      OneSignal__AppId: ${ONESIGNAL_APP_ID:-}
      OneSignal__ApiKey: ${ONESIGNAL_API_KEY:-}
      Matching__RadiiKm: ${MATCHING_RADII_KM:-25,50,100}
      Worker__PollSeconds: 10
      Worker__InstanceName: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  web:
    build:
      context: ./web/af-foundation-site
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
